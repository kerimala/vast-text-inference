name: vast-lab-open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    container_name: vast-lab-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_URL: http://localhost:3000
      CORS_ALLOW_ORIGIN: http://localhost:3000
      ENABLE_SIGNUP: "true"
      OPENAI_API_BASE_URLS: http://host.docker.internal:8000/v1
      OPENAI_API_KEYS: local-vllm
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  open-webui-data:
